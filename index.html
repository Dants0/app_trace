<!DOCTYPE html>
<html lang="pt-br" class="dark">

<head>
  <meta charset="UTF-8">
  <title>Trace Intelligence Pro - Dark Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #e2e8f0;
    }

    .loader {
      border-top-color: #3b82f6;
      animation: spinner 1.5s linear infinite;
    }

    @keyframes spinner {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1e293b;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>

<body class="min-h-screen font-sans">
  <div class="max-w-6xl mx-auto p-6">
    <header class="mb-10 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-extrabold text-white tracking-tight">Trace Intelligence <span
            class="text-blue-600">Pro</span></h1>
        <p class="text-white mt-1">Diagnóstico estratégico de PowerBuilder & SQL Server com IA.</p>
      </div>
      <div class="flex items-center gap-4 bg-slate-800 p-2 rounded-xl border border-slate-700">
        <label class="text-[10px] font-bold text-slate-500 uppercase px-2">Engine:</label>
        <select id="aiProvider"
          class="bg-slate-900 text-blue-400 text-xs font-bold p-1 rounded outline-none border-none cursor-pointer">
          <option value="openai">OpenAI GPT-4o</option>
          <option value="gemini">Google Gemini 1.5</option>
        </select>
      </div>
      <div class="text-right">
        <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase">Análise Contextual
          Ativa</span>
        <span class="bg-green-100 text-green-700 text-xs font-bold px-3 py-1 rounded-xl">v-2.0</span>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <div class="lg:col-span-1 space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-sm font-bold text-slate-700 uppercase mb-4">1. Contexto do Problema</h2>
          <textarea id="bugDescription"
            class="w-full h-32 p-3 text-black text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
            placeholder="Descreva o erro ou comportamento esperado (ex: Erro de coluna não encontrada ao abrir a tela de faturamento...)"></textarea>

          <h2 class="text-sm font-bold text-slate-700 uppercase mt-6 mb-4">2. Arquivos de Trace</h2>
          <label for="fileInput"
            class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer hover:bg-slate-50 transition-all">
            <svg class="w-8 h-8 text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M12 4v16m8-8H4" />
            </svg>
            <p class="text-xs text-slate-500">Selecionar Logs (.txt)</p>
            <input type="file" id="fileInput" class="hidden" multiple accept=".txt,.log" />
          </label>
          <div id="fileList" class="mt-2 text-xs text-blue-600 font-medium italic"></div>

          <div class="space-y-3 mt-8">
            <button onclick="handleProcess('analyze-trace')" id="btnAI"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-200 transition-all flex items-center justify-center gap-2">
              <span>ANÁLISE ESTRATÉGICA IA</span>
            </button>
            <button onclick="handleProcess('process-batch')" id="btnBatch"
              class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition-all">
              APENAS ESTRUTURAR JSON
            </button>
          </div>
        </div>
      </div>

      <div class="lg:col-span-2">
        <div id="loading"
          class="hidden flex flex-col items-center justify-center h-64 bg-white rounded-2xl border border-dashed border-slate-200">
          <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-100 h-12 w-12 mb-4"></div>
          <p class="text-slate-600 font-medium">Processando rastro e consultando IA...</p>
        </div>

        <div id="results" class="space-y-6">
          <div class="flex flex-col items-center justify-center h-64 text-slate-400">
            <svg class="w-16 h-16 mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <p>Aguardando upload para diagnóstico...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const sessionData = {};

    // Listener para mostrar nomes dos arquivos selecionados
    document.getElementById('fileInput').addEventListener('change', function (e) {
      const list = document.getElementById('fileList');
      list.innerText = `${e.target.files.length} arquivo(s) selecionado(s)`;
    });

    async function handleProcess(route) {
      const fileInput = document.getElementById('fileInput');
      const provider = document.getElementById('aiProvider').value;
      const bugDesc = document.getElementById('bugDescription').value;
      const resultsDiv = document.getElementById('results');
      const loading = document.getElementById('loading');

      if (fileInput.files.length === 0) {
        alert("Por favor, selecione ao menos um arquivo de log.");
        return;
      }

      // Preparação do FormData
      const formData = new FormData();
      formData.append('bugDescription', bugDesc); // Enviando a descrição para a IA
      formData.append('provider', provider)
      for (const file of fileInput.files) {
        formData.append('files', file); // 'files' deve ser o nome esperado no Go
      }

      // UI State
      loading.classList.remove('hidden');
      resultsDiv.innerHTML = '';

      try {
        // Chamada para a sua API Go
        const response = await fetch(`http://localhost:8000/${route}`, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error("Falha na comunicação com o servidor.");

        const data = await response.json();
        renderResults(data, route === 'analyze-trace');
      } catch (error) {
        resultsDiv.innerHTML = `
                    <div class="bg-red-50 border border-red-200 p-6 rounded-2xl text-red-700">
                        <h3 class="font-bold">Erro no Processamento</h3>
                        <p class="text-sm">${error.message}</p>
                    </div>
                `;
      } finally {
        loading.classList.add('hidden');
      }
    }

    function renderResults(reports, hasAI) {
      const resultsDiv = document.getElementById('results');

      reports.forEach((report, index) => {
        const fileKey = `report_${index}`;
        // Normaliza a origem dos dados conforme a rota
        const events = report.structured_data || report.data;
        sessionData[fileKey] = events;

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in";

        card.innerHTML = `
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/30">
                        <div>
                            <h3 class="font-bold text-slate-800">${report.filename}</h3>
                            <p class="text-xs text-slate-500">${events.length} eventos agrupados</p>
                        </div>
                        <button onclick="downloadJSON('${report.filename}', '${fileKey}')" 
                                class="text-xs bg-emerald-50 text-emerald-700 font-bold px-4 py-2 rounded-lg border border-emerald-100 hover:bg-emerald-100 transition-all">
                            BAIXAR JSON
                        </button>
                    </div>

                    <div class="p-6">
                        ${hasAI ? `
                            <div class="flex items-center gap-2 mb-4 text-blue-700 font-bold text-sm uppercase">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z"/></svg>
                                Diagnóstico da IA e Plano de Resolução
                            </div>
                            <div class="bg-blue-50 border border-blue-100 rounded-xl p-5 text-slate-700 text-sm whitespace-pre-line leading-relaxed italic">
                                ${report.strategic_analysis || report.strategic_plan}
                            </div>
                        ` : `
                            <div class="bg-slate-50 border border-slate-100 rounded-xl p-5 text-center text-slate-500 text-sm">
                                Processamento básico concluído. Clique em "Baixar JSON" para ver os dados estruturados.
                            </div>
                        `}
                    </div>
                `;
        resultsDiv.appendChild(card);
      });
    }

    function downloadJSON(filename, key) {
      const content = JSON.stringify(sessionData[key], null, 4);
      const blob = new Blob([content], { type: 'application/json' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `audit_${filename.split('.')[0]}.json`;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
    }
  </script>
</body>

</html>
